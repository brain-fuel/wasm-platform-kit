[package]
name = "host-sdk-runtime"
version = "0.2.0"
edition = "2024"
license = "MIT"

[features]
default = []
compiler = ["wasmtime/cranelift", "wasmtime/parallel-compilation", "wasmtime/all-arch"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "component-model", "async", "std"] }
wasmtime-wasi = "=50.0.1"
tokio = { version = "1", features = ["rt", "time", "io-util", "io-std", "macros"] }
cap-std = "3"
sha2 = "0.10"
tempfile = "=3.23.0"
